        device_id: "{{ d42_devices_info.api_devices.devices[0].device_id }}"
        include_cols: name,device_id,type_id,type,serial_no,asset_no,uuid,notes,last_updated,first_added,objectcategory_id,objectcategory,service_level_id,service_level,customer_id,customer,customers,in_service,virtual_host,blade_chassis,device_url,hardware_id,hardware,physicalsubtype_id,physicalsubtype,blade_slot_no,host_chassis_device_id,chassis_slot_id,device_virtual_host_id,device_cluster_id,additional_location_info,rack_id,start_at,orientation_id,orientation,xpos,where_id,where,reversed,virtualsubtype_id,virtualsubtype,datastores,data_center,os_id,os_name,os_version,os_version_no,os_architecture_id,os_architecture,total_cpus,core_per_cpu,threads_per_core,cpu_speed,hz_id,hz,ram,ram_size_type_id,ram_size_type,hard_disk_count,hard_disk_size,hard_disk_size_type_id,hard_disk_size_type,hw_sw_raid,hw_sw_raid_id,raid_type,raid_type_id,building_id,calculated_building_id,storage_room,storage_room_id,aliases,nonauthoritativealiases,custom_fields,tags
