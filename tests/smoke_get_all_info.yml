---
- name: Smoke test all Device42 info modules
  hosts: localhost
  gather_facts: false
  connection: local
  ignore_errors: true

  vars:
    d42_host: "{{ lookup('env', 'D42_HOST') }}"
    d42_client_key_raw: "{{ lookup('env', 'D42_CLIENT_KEY') | default('', true) }}"
    d42_client_secret_raw: "{{ lookup('env', 'D42_CLIENT_SECRET') | default('', true) }}"
    d42_userid_raw: "{{ lookup('env', 'D42_USERID') | default('', true) }}"
    d42_password_raw: "{{ lookup('env', 'D42_PASSWORD') | default('', true) }}"
    d42_proto: "{{ lookup('env', 'D42_PROTO') | default('https', true) }}"
    d42_port: "{{ lookup('env', 'D42_PORT') | default(443, true) | int }}"
    d42_sslverify: "{{ lookup('env', 'D42_SSLVERIFY') | default(false, true) | bool }}"
    d42_auth_mode: "{{ 'basic' if (d42_userid_raw | length > 0 and d42_password_raw | length > 0) else 'token' }}"
    d42_client_key: "{{ d42_client_key_raw if d42_auth_mode == 'token' else '' }}"
    d42_client_secret: "{{ d42_client_secret_raw if d42_auth_mode == 'token' else '' }}"
    d42_userid: "{{ d42_userid_raw if d42_auth_mode == 'basic' else '' }}"
    d42_password: "{{ d42_password_raw if d42_auth_mode == 'basic' else '' }}"

  tasks:
    - name: Show selected auth mode
      ansible.builtin.debug:
        msg:
          - "d42_auth_mode={{ d42_auth_mode }}"
          - "has_client_pair={{ (d42_client_key_raw | length > 0 and d42_client_secret_raw | length > 0) | ternary('yes', 'no') }}"
          - "has_user_pair={{ (d42_userid_raw | length > 0 and d42_password_raw | length > 0) | ternary('yes', 'no') }}"

    - name: Fail if both auth pairs are set
      ansible.builtin.assert:
        that:
          - not ((d42_client_key_raw | length > 0 and d42_client_secret_raw | length > 0) and (d42_userid_raw | length > 0 and d42_password_raw | length > 0))
        fail_msg: Do not set both token and basic credentials at the same time. Clear either D42_CLIENT_KEY+D42_CLIENT_SECRET or D42_USERID+D42_PASSWORD.
      ignore_errors: false

    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - d42_host | length > 0
          - (d42_client_key_raw | length > 0 and d42_client_secret_raw | length > 0) or (d42_userid_raw | length > 0 and d42_password_raw | length > 0)
        fail_msg: Set D42_HOST and either D42_CLIENT_KEY+D42_CLIENT_SECRET or D42_USERID+D42_PASSWORD before running this playbook.
      ignore_errors: false

    - name: Get API client keys
      xbh03.device42.admin_users_groups.d42_api_clientkeys_info:
        host: "{{ d42_host }}"
        client_key: "{{ d42_client_key if d42_client_key | length > 0 else omit }}"
        client_secret_key: "{{ d42_client_secret if d42_client_secret | length > 0 else omit }}"
        userid: "{{ d42_userid if d42_userid | length > 0 else omit }}"
        password: "{{ d42_password if d42_password | length > 0 else omit }}"
        proto: "{{ d42_proto }}"
        port: "{{ d42_port }}"
        sslverify: "{{ d42_sslverify }}"
        debug: true
      when: d42_auth_mode == 'token'

    - name: Get API clients
      xbh03.device42.admin_users_groups.d42_api_clients_info:
        host: "{{ d42_host }}"
        client_key: "{{ d42_client_key if d42_client_key | length > 0 else omit }}"
        client_secret_key: "{{ d42_client_secret if d42_client_secret | length > 0 else omit }}"
        userid: "{{ d42_userid if d42_userid | length > 0 else omit }}"
        password: "{{ d42_password if d42_password | length > 0 else omit }}"
        proto: "{{ d42_proto }}"
        port: "{{ d42_port }}"
        sslverify: "{{ d42_sslverify }}"
        limit: 10
        offset: 0
        fetch_all: false
      when: d42_auth_mode == 'token'

    - name: Get admin groups
      xbh03.device42.admin_users_groups.d42_api_admingroups_info:
        host: "{{ d42_host }}"
        client_key: "{{ d42_client_key if d42_client_key | length > 0 else omit }}"
        client_secret_key: "{{ d42_client_secret if d42_client_secret | length > 0 else omit }}"
        proto: "{{ d42_proto }}"
        port: "{{ d42_port }}"
        sslverify: "{{ d42_sslverify }}"
        include_cols: permissions
      when: d42_auth_mode == 'token'

    - name: Get admin users
      xbh03.device42.admin_users_groups.d42_api_adminusers_info:
        host: "{{ d42_host }}"
        client_key: "{{ d42_client_key if d42_client_key | length > 0 else omit }}"
        client_secret_key: "{{ d42_client_secret if d42_client_secret | length > 0 else omit }}"
        userid: "{{ d42_userid if d42_userid | length > 0 else omit }}"
        password: "{{ d42_password if d42_password | length > 0 else omit }}"
        proto: "{{ d42_proto }}"
        port: "{{ d42_port }}"
        sslverify: "{{ d42_sslverify }}"
        include_cols: auth_type,is_active,is_staff,username,id,email,groups,is_superuser,last_login,date_joined,password_doesnt_expire,last_name,first_name,invalid_login_attempts

    - name: Get application components
      xbh03.device42.application_components.d42_api_appcomps_info:
        host: "{{ d42_host }}"
        client_key: "{{ d42_client_key if d42_client_key | length > 0 else omit }}"
        client_secret_key: "{{ d42_client_secret if d42_client_secret | length > 0 else omit }}"
        userid: "{{ d42_userid if d42_userid | length > 0 else omit }}"
        password: "{{ d42_password if d42_password | length > 0 else omit }}"
        proto: "{{ d42_proto }}"
        port: "{{ d42_port }}"
        sslverify: "{{ d42_sslverify }}"
